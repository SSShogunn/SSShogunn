name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily (~11:47 AM IST)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
        env:
          GITHUB_PROFILE_USERNAME: SSShogunn
      - run: python scripts/render_heatmap_svg.py
      - run: python scripts/make_info_card.py
      - run: python scripts/make_boot_svg.py
      - run: python scripts/make_toplangs_svg.py
        env:
          GITHUB_PROFILE_USERNAME: SSShogunn
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg info-card.svg boot-banner.svg toplangs.svg"
